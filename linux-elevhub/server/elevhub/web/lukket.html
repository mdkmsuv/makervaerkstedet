<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{navn}} er lukket · Makerværkstedet</title>
<link rel="icon" href="/_elevhub/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: Metrophobic; src: url('/_elevhub/metrophobic.ttf') format('truetype'); }
  :root { --brand: #c62b2f; --ink: #333; --muted: #666; --line: #e1e1e1; --section: #f4f3f0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Metrophobic, Helvetica, Arial, sans-serif; color: var(--ink);
         background: var(--section); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 40px; background: #fff; border-bottom: 1px solid var(--line); }
  header img { width: 39px; height: 46px; }
  header span { font-size: 11px; letter-spacing: 1.8px; color: var(--muted); }
  header .brand-mark { display: block; width: 39px; height: 46px; position: relative; background: var(--brand); }
  header .brand-mark::after { content: ''; position: absolute; width: 16px; height: 16px; right: 5px; bottom: 5px; border-radius: 50%; background: #f2c94c; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; }
  .kort { max-width: 620px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 48px 56px; text-align: center; }
  svg { display: block; margin: 0 auto 24px; }
  h1 { font-size: 38px; line-height: 1.2; margin: 0 0 16px; font-weight: 500; }
  p { font-size: 21px; line-height: 1.55; margin: 0 0 12px; }
  .lille { font-size: 16px; color: var(--muted); margin-top: 24px; }
</style>
</head>
<body>
<header><span class="brand-mark" aria-hidden="true"></span><span>Makerværkstedet</span></header>
<main>
  <div class="kort" role="status">
    <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
      <circle cx="48" cy="48" r="46" fill="#fcf1f0"/>
      <rect x="28" y="44" width="40" height="30" rx="5" fill="#c62b2f"/>
      <path d="M36 44V34a12 12 0 0 1 24 0v10" fill="none" stroke="#c62b2f" stroke-width="6"/>
      <circle cx="48" cy="57" r="4" fill="#fff"/><path d="M48 59v6" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>{{navn}} er lukket lige nu</h1>
    <p>Læreren har lukket {{navn}}.</p>
    <p>Tryk på <strong>Til start</strong> øverst på skærmen for at vælge noget andet.</p>
    <p class="lille">Siden åbner af sig selv, når {{navn}} bliver åbnet igen.</p>
  </div>
</main>
<script>
  setInterval(function () {
    fetch('/_elevhub/aaben', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.aaben) { location.replace('/'); } })
      .catch(function () {});
  }, 3000);
</script>
</body>
</html>
