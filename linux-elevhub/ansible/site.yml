# Samlet opsætning af elevcomputerne.
#
# Fra Windows (se README.md):
#   wsl -d Debian -- bash "/mnt/d/Bambuslicer made easy/linux-elevhub/ansible/koer.sh" tjek
#   wsl -d Debian -- bash "/mnt/d/Bambuslicer made easy/linux-elevhub/ansible/koer.sh" koer

- name: Elevcomputere - grundopsætning og kiosk
  hosts: elevcomputere
  roles:
    - grundsystem
    - elevkonto
    - {role: adminkonto, tags: [adminkonto]}
    - arbejdsmapper
    - {role: kiosk, tags: [kiosk]}
    - projektbackup
