# Ansible-opsætning for Elevhub.
# Køres fra denne mappe på en Linux-controller (i testmiljøet: WSL på lærercomputeren).
#
# Ligger mappen på et Windows-drev (/mnt/d/...), ignorerer Ansible denne fil af
# sikkerhedshensyn, fordi mappen ser ud til at være skrivbar for alle. Peg så på
# den direkte:  export ANSIBLE_CONFIG="$PWD/ansible.cfg"

[defaults]
inventory = inventory/testmiljoe/hosts.yml
remote_user = elevhub
private_key_file = ~/.ssh/elevhub_ed25519
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
