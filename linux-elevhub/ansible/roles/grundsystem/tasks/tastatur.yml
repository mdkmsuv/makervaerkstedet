# Tastaturet skal være dansk allerede på den første administrative tty.
# Kioskrollen lægger desuden sin X11-konfiguration og setxkbmap på sessionen.

- name: Installer tastaturpakker til konsol og keyboard-configuration
  ansible.builtin.apt:
    name:
      - console-setup
      - keyboard-configuration
    state: present
    install_recommends: false
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: grundsystem_tastatur_pakker

- name: Gem dansk pc105-layout som systemets tastaturstandard
  ansible.builtin.copy:
    dest: /etc/default/keyboard
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (grundsystem).
      XKBMODEL="pc105"
      XKBLAYOUT="dk"
      XKBVARIANT=""
      XKBOPTIONS=""
      BACKSPACE="guess"

- name: Forbered konsolens tastaturcache uden at ændre en grafisk session
  ansible.builtin.command:
    argv:
      - /usr/bin/setupcon
      - --save-only
  changed_when: false
  when: not ansible_check_mode

- name: Konsolens tastaturservices kører tidligt ved hver opstart
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - keyboard-setup.service
    - console-setup.service
  when: not (ansible_check_mode and grundsystem_tastatur_pakker is changed)
