  ansible.builtin.systemd_service:
    name: elevhub-lokal
    enabled: false
    state: stopped
  when:
    - not kiosk_lokale_apps_enabled | bool
    - not ansible_check_mode

- name: Tastaturlayout i X
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/00-tastatur.conf
    content: |
      # Styres af Ansible (rollen kiosk).
      Section "InputClass"
          Identifier "tastatur"
          MatchIsKeyboard "on"
          Option "XkbLayout" "{{ kiosk_tastatur }}"
      EndSection
    owner: root
    group: root
    mode: "0644"
  notify: Genstart kiosk

- name: Elevhubbens startside
  ansible.builtin.template:
    src: start.html.j2
    dest: "{{ kiosk_startside_mappe }}/start.html"
    owner: root
    group: root
    mode: "0644"
  no_log: true
  notify: Genstart kiosk

- name: Indstillinger til elevbjælken
  ansible.builtin.copy:
    dest: /etc/elevhub/kiosk.json
    content: "{{ {'computer': inventory_hostname,
                  'computer_visning': inventory_hostname | regex_replace('^vaerksted', 'Værksted'),
                  'server': kiosk_server,
                  'hub': kiosk_protokol ~ '://' ~ kiosk_server ~ ':' ~ kiosk_hub_port,
                  'ca_fil': '/etc/elevhub/ca.pem',
                  'protokol': kiosk_protokol,
                  'usikker_test': kiosk_usikker_test | bool,
                  'ui_token': kiosk_enhed.ui_token,
                  'elev': kiosk_bruger,
                  'elev_porte': kiosk_app_porte + [kiosk_hub_port],
                  'lokale_app_urler': kiosk_lokale_app_urler,
                  'internet_app': kiosk_internet_app,
                  'theme': kiosk_theme,
                  'school_name': kiosk_school_name | default(''),
                  'webproxy_required': true} | to_nice_json }}"
    owner: root
    group: root
    mode: "0644"
  no_log: true
  notify:
    - Genstart elevhub-regler
    - Genstart kiosk

- name: Skriv root-enhedens credentials med begrænsede rettigheder
  ansible.builtin.copy:
    content: "{{ {'computer': kiosk_enhed.computer, 'token': kiosk_enhed.token} | to_nice_json }}"
    dest: /etc/elevhub/enhed.json
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Genstart elevhub-regler

- name: Skriv klientrelease til autentificeret status
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/elevhub/release.json"
    dest: /etc/elevhub/release.json
    owner: root
    group: root
    mode: "0644"
  notify: Genstart elevhub-regler

- name: Skriv Elevhubbens offentlige CA
  ansible.builtin.copy:
    content: "{{ kiosk_ca_indhold }}"
    dest: /etc/elevhub/ca.pem
    owner: root
    group: root
    mode: "0644"
  notify:
    - Genstart elevhub-regler
    - Genstart kiosk
  when: not kiosk_usikker_test | bool

- name: URL-politikker til lukket og åbent internet
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/elevhub/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [url-lukket.json, url-aaben.json]
  notify: Genstart elevhub-regler

- name: Squid-konfiguration til Elevhub (kun loopback)
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/elevhub/squid.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Genindlæs systemd
    - Stop elevhub-webproxy

- name: Squid-policyfil findes lukket før første autentificerede valg
  ansible.builtin.copy:
    content: "# Ingen autentificeret app-politik endnu.\nhttp_access deny all\n"
    dest: /etc/elevhub/webproxy-policy.conf
    owner: root
    group: root
    mode: "0600"
    force: false

- name: Elevhub-webproxy systemtjeneste
  ansible.builtin.template:
    src: elevhub-webproxy.service.j2
    dest: /etc/systemd/system/elevhub-webproxy.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Genindlæs systemd
    - Stop elevhub-webproxy

- name: Installer Elevhub-webproxy klientkode
  ansible.builtin.copy:
    src: elevhub-webproxy.py
    dest: /usr/local/lib/elevhub/elevhub-webproxy.py
    owner: root
    group: root
    mode: "0755"
  notify: Genstart elevhub-regler

- name: Elevhub-regler (håndhæver lærerens valg for internet)
  ansible.builtin.copy:
    src: elevhub-regler.py
    dest: /usr/local/lib/elevhub/elevhub-regler.py
    owner: root
    group: root
    mode: "0755"
  notify: Genstart elevhub-regler

- name: Fælles HTTPS-klient til Elevhub
  ansible.builtin.copy:
    src: elevhub_klient.py
    dest: /usr/local/lib/elevhub/elevhub_klient.py
    owner: root
    group: root
    mode: "0644"
  notify:
    - Genstart elevhub-regler
    - Genstart kiosk

- name: Elevhub-regler som systemtjeneste
  ansible.builtin.template:
    src: elevhub-regler.service.j2
    dest: /etc/systemd/system/elevhub-regler.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Genindlæs systemd
    - Genstart elevhub-regler

- name: Elevhub-regler starter ved opstart
  ansible.builtin.systemd_service:
    name: elevhub-regler
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Lokal CaDoodle-indgang til elevbjælken
  ansible.builtin.copy:
    src: cadoodle_vaerksted.py
    dest: /usr/local/lib/elevhub/cadoodle_vaerksted.py
    owner: root
    group: root
    mode: "0644"
  notify: Genstart kiosk

- name: Lokale sluk- og genstartknapper
  ansible.builtin.include_tasks: stroem.yml

- name: Lokal start af 3D fra værkstedssiden
  ansible.builtin.copy:
    src: workshop_launcher.py
    dest: /usr/local/lib/elevhub/workshop_launcher.py
    owner: root
    group: root
    mode: "0644"
  notify: Genstart kiosk

- name: Elevbjælken
  ansible.builtin.copy:
    src: elevbjaelke.py
    dest: /usr/local/lib/elevhub/elevbjaelke.py
    owner: root
    group: root
    mode: "0755"
  notify: Genstart kiosk

- name: Lokal elevsynlig opdateringsstatus
  ansible.builtin.copy:
    src: update_status.py
    dest: /usr/local/lib/elevhub/update_status.py
    owner: root
    group: root
    mode: "0644"
  notify: Genstart kiosk

- name: Skærmpause-overlay til elevbjælken
  ansible.builtin.copy:
    src: pause_overlay.py
    dest: /usr/local/lib/elevhub/pause_overlay.py
    owner: root
    group: root
    mode: "0644"
  notify: Genstart kiosk

- name: Uafhængig sikkerhedsvagt til skærmpause
  ansible.builtin.copy:
    src: pause_safety.py
    dest: /usr/local/lib/elevhub/pause_safety.py
    owner: root
    group: root
    mode: "0644"
  notify: Genstart kiosk

- name: Beskyt hovedcontaineren mod browserens egne lukkegenveje
  ansible.builtin.copy:
    src: browser_close_guard.py
    dest: /usr/local/lib/elevhub/browser_close_guard.py
    owner: root
    group: root
    mode: "0644"
  notify: Genstart kiosk

- name: Vinduesstyring med beskyttelse af værkstedets hovedvindue
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../kiosk-window-guard/bin/matchbox-window-manager"
    dest: /usr/local/lib/elevhub/matchbox-window-manager
    owner: root
    group: root
    mode: "0755"
  notify: Genstart kiosk

- name: Kiosksessionen
  ansible.builtin.template:
    src: kiosk-session.j2
    dest: /usr/local/lib/elevhub/kiosk-session
    owner: root
    group: root
    mode: "0755"
  notify: Genstart kiosk

- name: Kontrolværktøj til browserens skoleproxy
  ansible.builtin.copy:
    src: proxy_policy.py
    dest: /usr/local/lib/elevhub/proxy_policy.py
    owner: root
    group: root
    mode: "0644"

- name: Browserpolitik (tilladte sider, downloads og låste funktioner)
  ansible.builtin.template:
    src: chromium-politik.json.j2
    dest: /etc/chromium/policies/managed/elevhub.json
    owner: root
    group: root
    mode: "0644"
  notify: Genstart kiosk

- name: Kontrollér browserpolitikkens proxy og skoleundtagelser
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/lib/elevhub/proxy_policy.py
      - --policy
      - /etc/chromium/policies/managed/elevhub.json
      - --server
      - "{{ kiosk_server }}"
  changed_when: false

- name: Mappe til elevens GTK-indstillinger
  ansible.builtin.file:
    path: "/home/{{ kiosk_bruger }}/{{ item }}"
    state: directory
    owner: "{{ kiosk_bruger }}"
    group: "{{ kiosk_bruger }}"
    mode: "0755"
  loop: [.config, .config/gtk-3.0]

- name: Genveje i gem- og åbn-vinduet (Projekter og USB-nøgle)
  ansible.builtin.copy:
    dest: "/home/{{ kiosk_bruger }}/.config/gtk-3.0/bookmarks"
    content: |
      file:///home/{{ kiosk_bruger }}/Projekter Projekter
      file:///media/{{ kiosk_bruger }} USB-nøgle
    owner: "{{ kiosk_bruger }}"
    group: "{{ kiosk_bruger }}"
    mode: "0644"

- name: Ingen dvd-drev i gem- og åbn-vinduet (installationen skriver dem i fstab)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/dev/sr[0-9]'
    state: absent
  notify: Genstart kiosk

- name: Kiosken starter, når elevkontoen logger ind på tty1
  ansible.builtin.template:
    src: profil-kiosk.sh.j2
    dest: /etc/profile.d/elevhub-kiosk.sh
    owner: root
    group: root
    mode: "0644"
  notify: Genstart kiosk

- name: Automatisk login som elev på tty1
  ansible.builtin.copy:
    dest: /etc/systemd/system/getty@tty1.service.d/elevhub-autologin.conf
    content: |
      # Styres af Ansible (rollen kiosk).
      [Unit]
      Requires=elevhub-regler.service
      After=elevhub-regler.service
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin {{ kiosk_bruger }} --noissue --skip-login --nohostname %I $TERM
    owner: root
    group: root
    mode: "0644"
  notify:
    - Genindlæs systemd
    - Genstart kiosk

- name: Rolig opstart frem til værkstedet er klar
  ansible.builtin.include_tasks: opstart.yml
