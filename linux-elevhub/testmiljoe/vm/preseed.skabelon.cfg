#_preseed_V1
# Automatisk installation af en elevcomputer med Debian 13 i TESTMILJØET.
#
# Skabelonen udfyldes af testmiljoe\vaert\4-lav-installationsdisk.ps1:
#   @@NAVN@@    computernavn, fx vaerksted-01
#   @@IP@@      fast adresse, fx 192.168.50.11
#   @@VAERT@@   lærercomputerens adresse på testnettet (gateway)
#   @@NOEGLE@@  den OFFENTLIGE del af driftsnøglen
#
# Resultat: et minimalt Debian med SSH og driftskontoen "elevhub".
# Ingen konto får en brugbar adgangskode. Root er låst, og elevhub har kun
# SSH-nøgle og sudo uden adgangskode. Resten klares af Ansible.

### Sprog og tastatur
d-i debian-installer/language string da
d-i debian-installer/country string DK
d-i debian-installer/locale string da_DK.UTF-8
d-i keyboard-configuration/xkb-keymap select dk

### Netværk: fast adresse på testnettet (der er ingen DHCP)
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/get_ipaddress string @@IP@@
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string @@VAERT@@
d-i netcfg/get_nameservers string 9.9.9.9 1.1.1.1
d-i netcfg/confirm_static boolean true
d-i netcfg/get_hostname string @@NAVN@@
d-i netcfg/get_domain string
d-i netcfg/hostname string @@NAVN@@
d-i hw-detect/load_firmware boolean false

### Pakkearkiv
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Konti
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Elevhub drift
d-i passwd/username string elevhub
d-i passwd/user-password-crypted password !

### Ur
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Copenhagen
d-i clock-setup/ntp boolean true

### Disk: hele den første disk slettes og bruges til Debian (UEFI, én partition + swap)
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

### Pakker: kun basissystem, SSH, sudo og Python (til Ansible)
# python3-apt skal til, for at Ansibles apt-modul virker i tørkørsel (--check).
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string openssh-server sudo python3 python3-apt
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/enable-source-repositories boolean false

### Opstart
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

### SSH er klar ved første normale opstart, før Ansible køres.
### Kun den indbyggede offentlige driftsnøgle giver adgang som elevhub.
### enable skriver opstartslinks i målsystemet; ssh startes ikke i installerens chroot.
d-i preseed/late_command string \
    in-target install -d -m 700 -o elevhub -g elevhub /home/elevhub/.ssh && \
    echo '@@NOEGLE@@' > /target/home/elevhub/.ssh/authorized_keys && \
    in-target chown elevhub:elevhub /home/elevhub/.ssh/authorized_keys && \
    in-target chmod 600 /home/elevhub/.ssh/authorized_keys && \
    echo 'elevhub ALL=(ALL) NOPASSWD: ALL' > /target/etc/sudoers.d/elevhub && \
    in-target chmod 440 /etc/sudoers.d/elevhub && \
    in-target passwd -l elevhub && \
    in-target install -d -m 755 /etc/ssh/sshd_config.d /run/sshd && \
    for line in '# Elevhub: SSH fra første opstart; overtages senere af Ansible.' 'PermitRootLogin no' 'PasswordAuthentication no' 'KbdInteractiveAuthentication no' 'PubkeyAuthentication yes' 'PermitEmptyPasswords no' 'UsePAM yes' 'AllowUsers elevhub' 'AllowAgentForwarding no' 'X11Forwarding no' 'PermitTunnel no' 'MaxAuthTries 3' 'LoginGraceTime 30'; do echo "$line"; done > /target/etc/ssh/sshd_config.d/10-elevhub.conf && \
    in-target chmod 644 /etc/ssh/sshd_config.d/10-elevhub.conf && \
    in-target ssh-keygen -A && \
    in-target /usr/sbin/sshd -t && \
    in-target systemctl enable ssh.service

### Afslut: sluk maskinen, så installationsdiskene kan tages ud
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
