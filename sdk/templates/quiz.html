<p>Prøv spørgsmålet. Du kan ændre dit svar og prøve igen.</p>
    <form id="quiz">
      <fieldset>
        <legend>Hvad har en plante brug for, så den kan vokse?</legend>
        <label class="choice"><input type="radio" name="answer" value="water">Vand og lys</label>
        <label class="choice"><input type="radio" name="answer" value="dark">Et mørkt skab uden vand</label>
      </fieldset>
      <button type="submit">Tjek mit svar</button>
      <button class="secondary" type="reset">Prøv igen</button>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </form>
    <p class="hint">Dine svar gemmes ikke. Du kan gå til start, når du er færdig.</p>
